name: Groom Freeze Guard

# Enforces groom-sweep-policy §10.1's change freeze on the groom's core files
# (alpha-engine-config-I5235). Mirrors the alpha-engine-config guard for the
# nousergon-data side of the frozen surface.
#
# The freeze scope for this repo:
#   infrastructure/step_function_groom.json
#   infrastructure/lambdas/scheduled-groom-dispatcher/**
#
# Inlined 2026-07-28 — mirrors the gate-label-guard pattern (same pattern,
# different predicate).

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, ready_for_review, synchronize]
    paths:
      - 'infrastructure/step_function_groom.json'
      - 'infrastructure/lambdas/scheduled-groom-dispatcher/**'

permissions:
  contents: read

jobs:
  groom-freeze-guard:
    name: groom-freeze-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check for freeze exception
        run: |
          set -euo pipefail

          jq -r '.pull_request.labels[].name' "$GITHUB_EVENT_PATH" > /tmp/pr_labels.txt || true

          echo "Labels under check:"
          cat /tmp/pr_labels.txt || echo "(none)"

          if grep -qx 'freeze-exception' /tmp/pr_labels.txt; then
            echo "freeze-exception label present — exception granted."
            echo "PR body freeze-exception justification:"
            jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH" | grep -i 'freeze-exception:' || echo "(none found in body — consider adding one)"
            exit 0
          fi

          echo ""
          echo "::error::This PR modifies groom core files currently under §10.1 change freeze"
          echo "::error::(alpha-engine-config-I5235). Add the 'freeze-exception' label to this"
          echo "::error::PR, with a 'freeze-exception: <justification>' line in the PR body."
          echo "::error::The only legitimate justification during the freeze is moving cycle"
          echo "::error::completion rate (per §10.1). All other groom changes queue."
          exit 1
