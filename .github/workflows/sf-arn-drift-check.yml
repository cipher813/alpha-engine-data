name: SF-ARN Drift Check

# Catches drift on four config#1464 axes: EventBridge rule stateMachineArn
# drift, Step Function LoggingConfiguration drift, SF lambda:invoke
# states referencing Lambdas that don't exist live, and SF definition drift
# (codified vs live vs S3-staged — see check-definition-drift.py).
#
# NOT a pull_request check (Brian ruling 2026-08-10). Every step here
# compares CODIFIED source against LIVE AWS. That comparison says nothing
# about a PR's diff: it is red whenever live state has drifted, whoever
# caused it and whenever — so a PR author sees a red X they did not cause
# and cannot clear, and the merge decision gets clouded by a signal that is
# not about the change under review. Four steps had already been carved off
# the PR path one at a time for exactly this reason (weekly-cadence,
# SF-definition, fleet-wide scheduler, manifest drift); the 2026-08-10
# instance was the automation-pause step reddening #1291, whose diff was a
# Lambda capability profile, because a thinktank EventBridge rule had been
# re-enabled out of band. The trigger set is now the whole fix: drift is
# graded post-merge (push to main, right after the deploy applies) and daily
# out of band. Nothing is lost — no step ran on PRs that does not run here —
# and no drift red can ever sit on an open PR again.
#
# Corollary for anything added below: if a step reads live AWS, it belongs
# on this trigger set. If a future step grades the DIFF (codified vs
# codified), it belongs in ci.yml, not here.
#
# infrastructure/eventbridge/check-drift.py and
# infrastructure/step-functions/check-drift.py were merged code-complete
# and unit-tested in #607 (2026-07-03) but had nothing invoking them until
# now — the blocker was this PAT lacking `workflow` scope (config#1372,
# closed 2026-07-06) plus the OIDC role lacking the events:*/states:*/
# lambda:GetFunction permissions the scripts need (companion PR in
# crucible-executor, config#1464) to avoid failing on AccessDenied instead
# of real drift. infrastructure/step-functions/check-lambda-existence.py is
# new in this same PR (previously proposed, 2026-07-08, never built).
#
# AWS auth: OIDC -> github-actions-iam-drift-check role (defined in
# crucible-executor; trust policy permits both crucible-executor and
# nousergon-data). Same identity iam-drift-check.yml already uses.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/eventbridge/**'
      - 'infrastructure/step-functions/**'
      - 'infrastructure/lambdas/**/deploy.sh'
      - 'infrastructure/cloudformation/alpha-engine-orchestration.yaml'
      - 'infrastructure/deploy-infrastructure.sh'
      - 'infrastructure/step_function*.json'
      - 'infrastructure/scheduler/**'
      - 'infrastructure/automation_pause.json'
      - 'infrastructure/automation_pause.py'
      - 'infrastructure/overseer/arming.py'
      - 'infrastructure/overseer/playbooks.yaml'
      - 'infrastructure/weekly_cadence.json'
      - 'infrastructure/weekly_cadence_drift.py'
      - '.github/workflows/sf-arn-drift-check.yml'
  schedule:
    - cron: '30 9 * * *'   # daily, alongside the IAM sweep
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-iam-drift-check
          aws-region: us-east-1

      # pause_reconcile.py --publish writes its own console row through the
      # canonical envelope builder rather than a second hand-rolled JSON shape
      # (shared-code-policy: one shape, every call site). Same pin as
      # requirements.txt, for the reason deploy-infrastructure.yml states.
      - name: Install nousergon-lib (envelope builder for the console row)
        run: pip install "nousergon-lib @ git+https://github.com/nousergon/nousergon-lib@v0.124.49"

      # Brian ruling 2026-08-07: all scheduled automation paused except the
      # weekly/preopen/postclose SFs and the 24/7 box. This asserts the pause
      # still holds — the opposite direction from every other check here, and
      # the only surface that would notice a redeploy quietly switching a
      # paused trigger back on. Runs unconditionally on every trigger this
      # workflow has: the invariant is about live AWS, and tests/
      # test_automation_pause.py::test_ci_runs_the_pause_check pins that it
      # carries no `if:` — the 2026-08-10 fix was to the workflow's TRIGGER
      # set, never to this step's reachability.
      # Read-only; needs nothing beyond the events:DescribeRule +
      # scheduler:GetSchedule this role already holds.
      - name: Scheduled-automation pause still holds (live)
        run: python3 infrastructure/automation_pause.py --check

      # alpha-engine-config-I7056. The step above asks "is the pause intact".
      # This one asks the question nothing asked before it: for each of the
      # NINE Overseer components, is it armed, or is it off because someone
      # DECIDED it is off? Both look identical from run telemetry — a paused
      # playbook and a broken one each emit exactly nothing — and
      # observability-policy.md §8.3 forbids rendering either as the other.
      #
      # It goes red only on `undeclared-dark` and `trigger-absent`: a trigger
      # off with no recorded decision, or one that no longer exists. A declared
      # pause is NOT a finding (overseer-policy.md §7 — a kill switch is state,
      # surfaced everywhere, never alerted), so this step stays green for the
      # whole duration of the 2026-08-07 ruling and goes red the moment
      # something goes dark that nobody ruled on.
      #
      # This workflow is the right host precisely because it is a GitHub
      # Actions cron: it is outside the AWS pause entirely, so the observer
      # cannot be disarmed by the ruling it observes (overseer-policy.md
      # invariant 1 — the watcher sits outside its subject's dependency cone).
      # Read-only; needs nothing beyond the events:DescribeRule +
      # scheduler:GetSchedule this role already holds.
      - name: Overseer playbook arming (declared pause vs live, live)
        run: python3 infrastructure/overseer/arming.py --check

      # alpha-engine-config-I7118. The step above asks "does the pause hold for
      # the names the manifest lists". This one asks the question nothing asked
      # before it, in the two directions that list cannot reach:
      #
      #   * a trigger that is DARK and that NEITHER register declares off —
      #     neither automation_pause.json nor its observability registry row.
      #     The manifest's own coverage was hand-listed, which is
      #     observability-policy.md §2.2's defect one level up from the one the
      #     manifest fixes; this enumerates the account instead, so a trigger
      #     nobody named is a finding by construction. It found
      #     `alpha-research-openrouter-shadow-weekly` on the first run — ENABLED
      #     weekly work under the pause, in neither block and in no registry row.
      #   * a registry row asserting `lifecycle: disabled` while its trigger is
      #     live, or while quoting a manifest entry that no longer exists. Those
      #     declarations are hand-copied claims about a file in ANOTHER repo, and
      #     a row saying DISABLED renders green-adjacent, is excluded from
      #     staleness_honesty's violation set and is exempt from ABSENT
      #     candidacy — so a component running again behind one is silent
      #     everywhere. That is worse than the UNREPORTED it replaced, because
      #     UNREPORTED is loud.
      #
      # Detect-only, and structurally so: tests/test_pause_reconcile.py asserts
      # the module contains no mutating verb. Editing a lifecycle declaration
      # because a manifest entry moved would INFER a decision from a file diff.
      #
      # The registry is read from s3://alpha-engine-research/ops/registry/
      # observability.d/, the copy observability-registry-publish.yml syncs on
      # every merge that changes it and the same copy the console reads — no
      # cross-repo checkout, no second credential, no second schedule.
      - name: Pause manifest vs observability registry vs live AWS
        run: python3 infrastructure/pause_reconcile.py --check --publish

      # The record itself, on every run, so the verdict for all nine is
      # readable without re-deriving it — including when every one of them is
      # correctly silent. `always()` because the arming state is most worth
      # reading on the run where something above it failed.
      - name: Publish the arming record
        if: always()
        run: python3 infrastructure/overseer/arming.py --report --json | tee -a "$GITHUB_STEP_SUMMARY"

      # config#6701 deliverable 3-wiring: the declared weekly exercise-cadence
      # manifest vs the live SSM parameter, out-of-band of deploys (the deploy
      # path runs --enforce; this catches drift BETWEEN deploys). AccessDenied
      # here means ops-PR538's grant has not been applied yet — the DAILY
      # scheduled run staying red is the form-3 detector for that
      # operator-gated apply. (This step carried the first `if:` excluding the
      # PR path; the whole workflow now excludes it, so the guard is gone.)
      - name: Weekly exercise-cadence drift (manifest vs live SSM)
        run: python3 infrastructure/weekly_cadence_drift.py --check

      - name: EventBridge SF-ARN drift (codified vs live)
        run: python3 infrastructure/eventbridge/check-drift.py

      - name: SF LoggingConfiguration drift (codified vs live)
        run: python3 infrastructure/step-functions/check-drift.py

      - name: SF lambda:invoke Lambda-existence check (codified vs live)
        run: python3 infrastructure/step-functions/check-lambda-existence.py

      # The invariant here is "deployed truth == repo source", which only
      # exists once the branch is pushed: on a PR that changes
      # infrastructure/step_function*.json — the legitimate change mechanism —
      # the diff IS the divergence, and the restamp happens at deploy,
      # post-merge (config#2273). This check blocked the Director-terminal-
      # failure PR through three escalation cycles before it was carved off
      # the PR path (alpha-engine-config-I6591). Fleet-wide runs also happen
      # on every merge via deploy-infrastructure.yml, right after the deploy.
      - name: SF definition drift (codified vs live vs S3-staged)
        run: python3 infrastructure/step-functions/check-definition-drift.py

      # alpha-engine-config-I5805. The out-of-band half of schedule coverage.
      # deploy-scheduled-groom-dispatcher.yml reconciles + asserts on every
      # merge, which closes drift caused by a merge; this catches what no merge
      # can see — a rule disabled or retimed in the console, or one belonging to
      # a dispatcher whose repo has no deploy workflow at all.
      #
      # The PR-scoped variant of this step (changed deploy.sh files only,
      # --ignore-kind missing-in-aws) is deleted with the PR trigger: every
      # rule it covered is covered here unscoped, on merge and daily.
      - name: EventBridge Scheduler rule drift (fleet-wide, codified vs live)
        run: python3 infrastructure/scheduler/check-schedule-drift.py

      # alpha-engine-config-I6461: the manifest-vs-live leg check-schedule-
      # drift.py above does not cover (manifest completeness — reason +
      # actuation_tier + attended_window present — and manifest cron vs LIVE
      # AWS state, not just vs the deploy.sh literal). --live makes an AWS
      # call per manifest entry, which is why it belongs on merge and the
      # daily sweep rather than on every push of a branch.
      - name: schedule-manifest.json drift (fleet-wide, vs live AWS)
        run: python3 infrastructure/scheduler/check-manifest-drift.py --live
