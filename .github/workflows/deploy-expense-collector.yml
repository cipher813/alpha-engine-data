name: Deploy expense-collector

# Auto-deploy the alpha-engine-expense-collector Lambda CODE AND SCHEDULES
# on merge to main.
#
# Runs deploy.sh twice: flagless for Lambda code, then --reconcile-schedules
# for EventBridge Scheduler rule upsert + prune. Both halves run under the
# github-actions-lambda-deploy OIDC role, which holds scheduler:* and the
# scoped iam:PassRole the reconciler needs but deliberately lacks iam:CreateRole
# / iam:PutRolePolicy (fleet single-writer rule after 4 IAM-clobber incidents).
#
# alpha-engine-config-I5805: before the --reconcile-schedules split, a merged
# cadence change was inert until an operator ran --bootstrap by hand — which is
# how the reconcile-monthly rule sat in source for months without ever being
# created. The CI path now creates/updates/prunes schedules on every merge.
#
# IAM: no new grant needed — github-actions-lambda-deploy already covers
# scheduler:{Get,List,Create,Update,Delete}Schedule + the scoped iam:PassRole.

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/lambdas/expense-collector/**'
      - '.github/workflows/deploy-expense-collector.yml'
  workflow_dispatch:

concurrency:
  group: deploy-expense-collector-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy expense-collector Lambda (code + schedules)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Third-party actions SHA-pinned (CodeQL unpinned-tag findings on this
      # PR; supply-chain hardening — fleet-wide migration tracked separately).
      - name: Checkout data repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          path: alpha-engine-data

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Set up Python 3.12 (match Lambda runtime)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Deploy expense-collector code (flagless — the CI path, step 1)
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/expense-collector/deploy.sh

      - name: Reconcile expense-collector schedules (--reconcile-schedules — the CI path, step 2)
        working-directory: alpha-engine-data
        run: bash infrastructure/lambdas/expense-collector/deploy.sh --reconcile-schedules

      - name: Report deployed version
        working-directory: alpha-engine-data
        run: |
          echo "Deployed commit: ${{ github.sha }}"
          aws lambda get-function \
            --function-name alpha-engine-expense-collector \
            --query "Configuration.[LastModified,CodeSha256]" \
            --output text

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@6ed6c2050ecd4e87284283c7ee16539672704fc9 # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy-expense-collector.yml

  notify-main-failure:
    needs: [deploy]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@62597e550c08c0b7a7fe0af490cb141e344061b3 # main
    secrets: inherit
