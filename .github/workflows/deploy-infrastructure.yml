name: Deploy Infrastructure

# Stamp + deploy the orchestration SF + CF stack on every push to main so the
# deploy-drift preflight never halts the weekday/Saturday pipelines on a stale
# SHA. The drift probe's contract is "SF/CF stamp == origin/main HEAD" — any
# commit to main that doesn't rebuild this stack breaks that contract.
#
# No path filter: every main commit restamps, regardless of whether the
# commit touched infrastructure/. This is the deliberate trade-off. 30s of
# no-op CF update-stack + SF update-state-machine per merge in exchange for
# eliminating the entire drift class. Cost is ~nothing; benefit is the
# pipeline never silently halts on stamp drift again.
#
# Template-content changes (adding an alarm, modifying a rule) still work
# here because apply.sh in nous-ergon-ops/infrastructure/iam/ is the
# source of truth for the GHA role's policy and will have been applied
# before the PR merges.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-infrastructure-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infrastructure:
    name: Stamp SF + CF with main HEAD
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      blast_radius_message: ${{ steps.blast_radius.outputs.message }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::711398986525:role/github-actions-lambda-deploy
          aws-region: us-east-1

      - name: Deploy orchestration infrastructure
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash infrastructure/deploy-infrastructure.sh

      - name: Report deployed stamp
        run: |
          aws cloudformation describe-stacks \
            --stack-name alpha-engine-orchestration \
            --query "Stacks[0].[StackStatus,Tags[?Key=='git-sha'].Value|[0]]" \
            --output text

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: '3.11'

      - name: Install drift-check alerting dependency
        # Base package only (no [arcticdb,flow-doctor,rag,contracts] extras —
        # those are for other subsystems; alerts.publish needs none of them).
        # Same pin as requirements.txt so this step's nousergon_lib.alerts
        # behavior never drifts from the rest of the repo's alerting.
        run: pip install "nousergon-lib @ git+https://github.com/nousergon/nousergon-lib@v0.124.78"

      - name: Verify SF definitions match live + S3-staged copies (config#2391)
        run: python3 infrastructure/step-functions/check-definition-drift.py

      - name: Append to system-wide deploy changelog
        if: always()
        uses: nousergon/nousergon-docs/.github/actions/append-changelog@8a904b7a817901f2520dd87131ff307ed97fee02 # main
        with:
          deploy_status: ${{ job.status == 'success' && 'success' || 'failure' }}
          deploy_workflow: deploy-infrastructure.yml

      # alpha-engine-config-I7800: computed unconditionally (always()) so it
      # runs on both a clean deploy (harmless, unused) and a failure (feeds
      # notify-main-failure below). Pure stdlib (datetime/zoneinfo) — no pip
      # install, so it can't itself fail on a dependency problem and mask the
      # real deploy failure this step exists to annotate.
      - name: Compute blast radius (I7800)
        id: blast_radius
        if: always()
        run: |
          MSG="$(python3 infrastructure/deploy_blast_radius.py --message-only)"
          echo "message<<BLASTRADIUS_EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "BLASTRADIUS_EOF" >> "$GITHUB_OUTPUT"
          echo "$MSG"

  # Alert (Telegram) on genuine post-merge failure of this workflow on the
  # default branch. Reusable workflow + transport in nousergon-lib. config#1128.
  #
  # alpha-engine-config-I7800: pinned to a commit on nousergon-lib's
  # feat/notify-message-override-i7800 branch (predates that branch's merge
  # to main — GitHub resolves a workflow_call ref from any pushed commit, not
  # just main history, so this works regardless of merge order). Re-pin to
  # nousergon-lib@main HEAD once nousergon-lib-PR<TBD> (the notify-ci-
  # failure.yml `blast_radius_message` input) merges — tracked in this PR's
  # body, not left as a silent follow-up.
  notify-main-failure:
    needs: [deploy-infrastructure]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    uses: nousergon/nousergon-lib/.github/workflows/notify-ci-failure.yml@a5394d3754c1b6bbf4365a29808f191bbd37cd50 # feat/notify-message-override-i7800 (alpha-engine-config-I7800) — re-pin to main once nousergon-lib-PR<TBD> merges
    with:
      blast_radius_message: ${{ needs.deploy-infrastructure.outputs.blast_radius_message }}
    secrets: inherit
